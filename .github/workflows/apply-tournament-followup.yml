name: Apply tournament follow-up
'on':
  push:
    branches:
      - fix/tournaments-phase4-web-followup
    paths:
      - .github/workflows/apply-tournament-followup.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tournaments-phase4-web-followup
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Apply tournament follow-up
        run: python .github/scripts/apply-tournament-followup.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Core regression
        run: npm run test:core
      - name: Offline Next build
        run: npm run build:offline
      - name: Commit validated product changes
        run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          rm .github/workflows/apply-tournament-followup.yml .github/scripts/apply-tournament-followup.py
          git add app/snooker/snooker-data-center-v2.tsx app/snooker/snooker-priority.module.css tests/tournaments-phase4-followup.test.mjs .github
          git commit -m 'fix(tournaments): stabilize detail navigation and web layout'
          git push origin HEAD:fix/tournaments-phase4-web-followup
