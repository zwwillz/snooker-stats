name: RC source cleanup

on:
  push:
    branches: [fix/phase3-rc-p0-p1]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase3-rc-p0-p1
      - name: Apply exact source cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/snooker/snooker-data-center-v2.tsx')
          text = path.read_text()
          signature_fn = '''function matchSignature(match: SnookerMatch) {
            return JSON.stringify({
              score1: match.score1,
              score2: match.score2,
              status: match.status,
              frames: match.frames?.map((frame) => [frame.frameNo, frame.score1, frame.score2, frame.break1, frame.break2]) ?? [],
            });
          }

          '''
          signature_ref = '''  const signatures = useRef(new Map(initialDatabaseEvents.flatMap((event) => allMatches(event)).map((match) => [match.id, matchSignature(match)])));
'''
          old_poll = '''  const pollReferenceTime = sourceHealth?.fetchedAt && Number.isFinite(Date.parse(sourceHealth.fetchedAt)) ? Date.parse(sourceHealth.fetchedAt) : Date.now();
'''
          new_poll = '''  const snapshotReferenceTime = Date.parse(snapshot.builtAt);
          const pollReferenceTime = sourceHealth?.fetchedAt && Number.isFinite(Date.parse(sourceHealth.fetchedAt))
            ? Date.parse(sourceHealth.fetchedAt)
            : Number.isFinite(snapshotReferenceTime) ? snapshotReferenceTime : 0;
'''
          for needle in (signature_fn, signature_ref, old_poll):
            if needle not in text:
              raise SystemExit('expected source pattern not found')
          text = text.replace(signature_fn, '', 1).replace(signature_ref, '', 1).replace(old_poll, new_poll, 1)
          path.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/snooker/snooker-data-center-v2.tsx
          git commit -m "fix(snooker): keep polling reference render-pure [auto-patch]"
          git push origin HEAD:fix/phase3-rc-p0-p1
