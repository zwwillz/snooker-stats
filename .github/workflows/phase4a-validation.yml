name: Phase 4A focused validation

on:
  push:
    branches: [feat/tournaments-phase4a-web]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[phase4a-validation-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Install feature dependencies
        run: npm ci
      - name: Offline production build on Phase 4A
        run: npm run build:offline
      - name: Reproduce core regression on latest main baseline
        id: baseline
        shell: bash
        run: |
          set +e
          git fetch origin main
          git worktree add /tmp/snooker-main origin/main
          cd /tmp/snooker-main
          npm ci >/tmp/main-npm-ci.log 2>&1
          npm run test:core > /tmp/main-core.log 2>&1
          status=$?
          cat /tmp/main-core.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if grep -q "技术榜表格需要一个允许表体滚动的 desktop data viewport" /tmp/main-core.log; then
            echo "technical_viewport_failure=true" >> "$GITHUB_OUTPUT"
          else
            echo "technical_viewport_failure=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Summarize baseline result
        run: |
          echo "main core exit: ${{ steps.baseline.outputs.status }}"
          echo "main has same technical viewport failure: ${{ steps.baseline.outputs.technical_viewport_failure }}"
          if [ "${{ steps.baseline.outputs.technical_viewport_failure }}" != "true" ]; then
            echo "Expected baseline technical viewport failure was not reproduced."
            exit 1
          fi
      - name: Remove validation workflow and commit cleanup
        run: |
          git worktree remove /tmp/snooker-main --force || true
          rm -f .github/workflows/phase4a-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: complete phase4a validation [phase4a-validation-complete]"
          git push origin HEAD:feat/tournaments-phase4a-web
