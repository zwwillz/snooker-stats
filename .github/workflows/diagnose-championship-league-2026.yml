# diagnostics only
name: Diagnose Championship League 2026

on:
  push:
    branches: [feature/event-series-season-filter]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare WST and Supabase data
        env:
          PUBLIC_KEY: ${{ secrets.SNOOKER_SUPABASE_PUBLISHABLE_KEY }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/diagnose-championship-league-2026.mjs
