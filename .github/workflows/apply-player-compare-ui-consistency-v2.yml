name: Verify Player Compare UI Consistency V2

on:
  push:
    branches:
      - fix/player-compare-ui-consistency-v2

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/player-compare-ui-consistency-v2
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Apply UI consistency patch
        run: node scripts/apply-player-compare-ui-consistency-v2.mjs
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Core regression tests
        run: npm run test:core
      - name: Offline build
        run: npm run build:offline
      - name: Remove temporary patch tooling
        run: rm -f scripts/apply-player-compare-ui-consistency-v2.mjs .github/workflows/apply-player-compare-ui-consistency-v2.yml
      - name: Commit verified UI consistency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/compare/player-compare-teaser.tsx app/snooker/compare/player-compare-teaser.module.css app/snooker/compare/player-compare.module.css app/snooker/data/data-ranking-content.tsx app/snooker/snooker-data-center-v2.tsx tests/snooker-player-compare-ui-consistency.test.mjs
          git add -A scripts/apply-player-compare-ui-consistency-v2.mjs .github/workflows/apply-player-compare-ui-consistency-v2.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: unify player compare UI patterns"
          git push origin HEAD:fix/player-compare-ui-consistency-v2
