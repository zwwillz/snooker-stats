name: Verify Player Compare Home Polish V3

on:
  push:
    branches:
      - fix/player-compare-home-polish-v3

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/player-compare-home-polish-v3
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Apply polish patch
        run: node scripts/apply-player-compare-home-polish-v3.mjs
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Core regression tests
        run: npm run test:core
      - name: Offline build
        run: npm run build:offline
      - name: Remove temporary patch tooling
        run: rm -f scripts/apply-player-compare-home-polish-v3.mjs .github/workflows/apply-player-compare-home-polish-v3.yml
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/compare/player-compare-teaser.tsx \
                  app/snooker/compare/player-compare-client.tsx \
                  app/snooker/compare/player-compare.module.css \
                  app/snooker/players/player-detail-inline.tsx \
                  app/snooker/snooker-data-center-v2.tsx \
                  app/snooker/snooker-data-center.module.css \
                  app/snooker/snooker-priority.module.css \
                  lib/snooker/live-client.ts \
                  tests/snooker-player-compare-home-polish-v3.test.mjs \
                  scripts/apply-player-compare-home-polish-v3.mjs \
                  .github/workflows/apply-player-compare-home-polish-v3.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: polish compare navigation and live cards"
            git push origin HEAD:fix/player-compare-home-polish-v3
          fi
