name: Apply Phase 4BC web redesign
'on':
  push:
    branches: ['feat/tournaments-phase4a-web']
    paths: ['.github/workflows/apply-phase4bc-web-redesign.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
      - name: Apply approved redesign
        run: python .github/scripts/redesign-phase4bc-web.py
      - name: Commit product changes
        run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          rm .github/workflows/apply-phase4bc-web-redesign.yml .github/scripts/redesign-phase4bc-web.py
          git add app/snooker/snooker-data-center-v2.tsx app/snooker/snooker-priority.module.css tests/snooker-data-foundation.test.mjs tests/tournaments-phase4.test.mjs .github
          git commit -m 'feat(tournaments): redesign web event and match details'
          git push origin HEAD:feat/tournaments-phase4a-web
