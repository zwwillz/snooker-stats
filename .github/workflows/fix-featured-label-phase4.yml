name: Fix Phase 4 featured label
'on':
  push:
    branches: ['feat/tournaments-phase4a-web']
    paths: ['.github/workflows/fix-featured-label-phase4.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
      - name: Fix featured-event labels and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          ui=Path('app/snooker/snooker-data-center-v2.tsx')
          s=ui.read_text()
          s=s.replace('label={activeEventCard ? "当前赛事" : graceEventCard ? "刚刚结束" : "下一站"}', 'label={activeEventCard ? "当前赛事" : firstUpcomingMain ? "下一站" : "刚刚结束"}')
          s=s.replace('{activeEventCard ? "CURRENT TOURNAMENT" : graceEventCard ? "JUST FINISHED" : "NEXT TOURNAMENT"}', '{activeEventCard ? "CURRENT TOURNAMENT" : firstUpcomingMain ? "NEXT TOURNAMENT" : "JUST FINISHED"}')
          ui.write_text(s)
          test=Path('tests/snooker-data-foundation.test.mjs')
          t=test.read_text().replace('assert.match(uiSource, /label=\\{activeEventCard \\? "当前赛事" : graceEventCard \\? "刚刚结束" : "下一站"\\}/);', 'assert.match(uiSource, /label=\\{activeEventCard \\? "当前赛事" : firstUpcomingMain \\? "下一站" : "刚刚结束"\\}/);')
          test.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          rm .github/workflows/fix-featured-label-phase4.yml
          git add app/snooker/snooker-data-center-v2.tsx tests/snooker-data-foundation.test.mjs .github
          git commit -m 'fix(tournaments): align featured event labels with priority'
          git push origin HEAD:feat/tournaments-phase4a-web
