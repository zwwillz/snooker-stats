name: Verify Championship League 2026 repair

on:
  push:
    branches: [feature/event-series-season-filter]

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/event-series-season-filter
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Synchronize migration inventory
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const dir = 'supabase/migrations';
          const files = fs.readdirSync(dir).filter((name) => name.endsWith('.sql')).sort();
          const manifestPath = 'supabase/migration-checksums.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.migrations = files.map((file) => {
            const match = file.match(/^(\d{14})_(.+)\.sql$/);
            if (!match) throw new Error(`Unexpected migration filename: ${file}`);
            const source = fs.readFileSync(path.join(dir, file), 'utf8');
            return {
              version: match[1],
              name: match[2],
              md5: crypto.createHash('md5').update(source).digest('hex'),
            };
          });
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const testPath = 'tests/snooker-migration-reproducibility.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace('assert.equal(files.length, 63);', 'assert.equal(files.length, 65);');
          test = test.replace('assert.equal(checksums.length, 63);', 'assert.equal(checksums.length, 65);');
          fs.writeFileSync(testPath, test);
          NODE
      - name: Remove one-shot workflow before verification
        run: rm -f .github/workflows/apply-championship-league-2026-repo-sync.yml
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Core regression tests
        run: npm run test:core
      - name: Offline build
        run: npm run build:offline
      - name: Commit verified repository state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair 2026 Championship League source data"
          git push origin HEAD:feature/event-series-season-filter
