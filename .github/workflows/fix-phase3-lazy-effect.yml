name: Apply Phase 3 Lazy Effect Fix

on:
  push:
    branches:
      - perf/homepage-phase3-redo
    paths:
      - .github/workflows/fix-phase3-lazy-effect.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/homepage-phase3-redo
          fetch-depth: 0
      - run: python .github/scripts/fix_phase3_lazy_effect.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/snooker-data-center-v2.tsx
          git diff --cached --check
          git commit -m "perf: schedule lazy root data loads after first paint"
          git push origin HEAD:perf/homepage-phase3-redo
