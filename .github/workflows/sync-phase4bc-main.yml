name: Sync Phase 4BC base
on:
  push:
    branches:
      - feat/tournaments-phase4a-web
    paths:
      - .github/workflows/sync-phase4bc-main.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.event.head_commit.message == 'chore: sync phase4bc base'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
          fetch-depth: 0
      - name: Merge latest main
        run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feat/tournaments-phase4a-web
