name: Phase 4A CSS prefix repair

on:
  push:
    branches: [feat/tournaments-phase4a-web]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[phase4a-css-prefix-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
          fetch-depth: 0
      - name: Normalize marker prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/snooker/snooker-priority.module.css')
          text = path.read_text()
          old = '\\n\\n/* TOURNAMENTS_PHASE4A_DESKTOP */'
          new = '\n\n/* TOURNAMENTS_PHASE4A_DESKTOP */'
          if text.count(old) != 1:
              raise SystemExit(f'expected one serialized marker prefix, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/phase4a-css-prefix-repair.yml').unlink(missing_ok=True)
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(tournaments): normalize phase4a css prefix [phase4a-css-prefix-fixed]"
          git push origin HEAD:feat/tournaments-phase4a-web
