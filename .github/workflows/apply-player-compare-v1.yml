name: Verify Player Compare V1

on:
  push:
    branches:
      - feature/player-compare-v1

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/player-compare-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm

      - name: Apply integrations
        run: node scripts/apply-player-compare-v1-integration.mjs

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Core regression tests
        run: npm run test:core

      - name: Offline build
        run: npm run build:offline

      - name: Remove temporary integration tooling
        run: |
          rm -f scripts/apply-player-compare-v1-integration.mjs
          rm -f .github/workflows/apply-player-compare-v1.yml

      - name: Commit verified integrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/snooker-data-center-v2.tsx app/snooker/data/data-ranking-content.tsx app/snooker/players/player-detail-inline.tsx app/snooker/players/player.module.css scripts/apply-player-compare-v1-integration.mjs .github/workflows/apply-player-compare-v1.yml
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "feat: integrate player compare across snooker data experience"
            git push origin HEAD:feature/player-compare-v1
          fi
