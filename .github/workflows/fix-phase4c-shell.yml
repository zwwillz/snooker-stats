name: Fix Phase 4C shell
'on':
  push:
    branches: ['feat/tournaments-phase4a-web']
    paths: ['.github/workflows/fix-phase4c-shell.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
      - run: python .github/scripts/fix-phase4c-shell.py
      - run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          rm .github/workflows/fix-phase4c-shell.yml .github/scripts/fix-phase4c-shell.py
          git add app/snooker/snooker-data-center-v2.tsx .github
          git commit -m 'fix(tournaments): apply desktop match detail shell'
          git push origin HEAD:feat/tournaments-phase4a-web
