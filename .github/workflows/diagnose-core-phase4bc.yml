name: Diagnose Phase 4BC core
'on':
  push:
    branches: ['feat/tournaments-phase4a-web']
    paths: ['.github/workflows/diagnose-core-phase4bc.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - run: npm ci
      - name: Capture core regression output
        run: npm run test:core > phase4bc-core-output.txt 2>&1 || true
      - name: Save diagnostics
        run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          git add phase4bc-core-output.txt
          git commit -m 'chore: capture phase4bc core output'
          git push origin HEAD:feat/tournaments-phase4a-web
