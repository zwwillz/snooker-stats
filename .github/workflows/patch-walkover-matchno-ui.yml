name: Temporary UI Patch

on:
  push:
    branches: [fix/walkover-matchno-ui]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/walkover-matchno-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - run: node scripts/patch-walkover-matchno-ui.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/snooker-data-center-v2.tsx app/snooker/snooker-ui-polish.module.css
          git diff --cached --quiet && exit 0
          git commit -m "feat: show walkovers and match numbers [ui-patched]"
          git push origin HEAD:fix/walkover-matchno-ui
