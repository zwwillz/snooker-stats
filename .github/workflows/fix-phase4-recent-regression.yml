name: Fix Phase 4 recent-event regression
'on':
  push:
    branches: ['feat/tournaments-phase4a-web']
    paths: ['.github/workflows/fix-phase4-recent-regression.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
      - name: Align recent-event regression with Phase 4A
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/snooker-data-foundation.test.mjs')
          s=p.read_text()
          old='''test("recent events and the season calendar follow individual WST events", async () => {\n  const uiSource = await read("app/snooker/snooker-data-center-v2.tsx");\n  assert.match(uiSource, /const recentEvents = seasonCalendar/);\n  assert.match(uiSource, /item\\.endDate < today \\|\\| isActiveOn\\(item, today\\) \\|\\| item\\.id === firstUpcomingCurrent\\?\\.id \\|\\| item\\.id === featuredEventCard\\?\\.id/);\n  assert.match(uiSource, /recentListEvents\\.map/);\n  assert.match(uiSource, /selectedSeasonEvents\\.map/);\n  assert.doesNotMatch(uiSource, /多阶段赛事合并为一站/);\n});'''
          new='''test("recent events stay capped at five cards and the season calendar keeps individual WST events", async () => {\n  const uiSource = await read("app/snooker/snooker-data-center-v2.tsx");\n  assert.match(uiSource, /const recentFeaturedEvent = activeEventCard/);\n  assert.match(uiSource, /const recentCompletedEvents = \\[\\.\\.\\.mainSeasonEvents\\]/);\n  assert.match(uiSource, /\\.slice\\(0, 3\\)/);\n  assert.match(uiSource, /const recentCardEvents = \\[firstUpcomingCurrent, \\.\\.\\.recentCompletedEvents\\]/);\n  assert.match(uiSource, /\\.slice\\(0, 4\\)/);\n  assert.match(uiSource, /recentCardEvents\\.map/);\n  assert.match(uiSource, /最多 5 站/);\n  assert.match(uiSource, /查看本赛季完整赛历/);\n  assert.match(uiSource, /selectedSeasonEvents\\.map/);\n  assert.doesNotMatch(uiSource, /多阶段赛事合并为一站/);\n});'''
          if old not in s:
              raise SystemExit('old recent-events regression block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Clean diagnostics and commit
        run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          rm -f .github/workflows/fix-phase4-recent-regression.yml .github/workflows/diagnose-phase4-final.yml phase4-final-core.txt
          git add tests/snooker-data-foundation.test.mjs .github phase4-final-core.txt
          git commit -m 'test(tournaments): cover phase4 recent event cards'
          git push origin HEAD:feat/tournaments-phase4a-web
