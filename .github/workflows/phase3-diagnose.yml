name: Phase 3 Diagnostics

on:
  push:
    branches: [perf/homepage-phase3-redo]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Run tests individually
        id: tests
        shell: bash
        run: |
          set +e
          RESULT=/tmp/phase3-diagnostics.md
          printf '## Phase 3 diagnostic results\n\n' > "$RESULT"
          FAILURES=0
          for f in tests/*.test.mjs; do
            OUT=$(mktemp)
            node --test "$f" >"$OUT" 2>&1
            CODE=$?
            if [ "$CODE" -ne 0 ]; then
              FAILURES=$((FAILURES + 1))
              printf '### FAIL: `%s`\n\n```text\n' "$f" >> "$RESULT"
              tail -n 120 "$OUT" >> "$RESULT"
              printf '\n```\n\n' >> "$RESULT"
            fi
            rm -f "$OUT"
          done
          if [ "$FAILURES" -eq 0 ]; then
            printf 'All individual test files passed.\n' >> "$RESULT"
          else
            printf '**Failing test files: %s**\n' "$FAILURES" >> "$RESULT"
          fi
          echo "failures=$FAILURES" >> "$GITHUB_OUTPUT"
      - name: Comment diagnostic result on PR 43
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/phase3-diagnostics.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 43,
              body: body.slice(0, 60000),
            });
      - name: Fail when diagnostics found failures
        if: steps.tests.outputs.failures != '0'
        run: exit 1
