name: Apply schedule stability fixes

on:
  push:
    branches: [feature/event-series-season-filter]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/event-series-season-filter
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Apply fixes
        run: node scripts/run-schedule-stability-fixes.mjs
      - name: Remove one-shot helpers before verification
        run: |
          rm -f scripts/apply-schedule-stability-fixes.mjs
          rm -f scripts/run-schedule-stability-fixes.mjs
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Core regression tests
        run: npm run test:core
      - name: Offline build
        run: npm run build:offline
      - name: Commit verified changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-schedule-stability-fixes.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize schedule ordering and event details"
          git push origin HEAD:feature/event-series-season-filter
