name: Apply live series experience

on:
  push:
    branches: [feature/event-series-season-filter]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/event-series-season-filter
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - name: Apply one-shot patch
        run: |
          node scripts/run-live-series-patch.mjs
          node scripts/fix-live-series-lint.mjs
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Core regression tests
        run: npm run test:core
      - name: Offline build
        run: npm run build:offline
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/snooker-data-center-v2.tsx app/snooker/snooker-priority.module.css lib/snooker/database-public.ts supabase/migrations/20260825191000_harden_live_match_status_transitions.sql supabase/migration-checksums.json tests/snooker-live-series-experience.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "feat: stabilize live scores and event series experience"
          git push origin HEAD:feature/event-series-season-filter
