name: Apply Lightweight Live Poll Refactor

on:
  push:
    branches:
      - perf/homepage-phase3-redo
    paths:
      - .github/workflows/apply-lightweight-live-poll.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/homepage-phase3-redo
          fetch-depth: 0
      - run: python .github/scripts/apply_lightweight_live_poll.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/snooker-data-center-v2.tsx
          git diff --cached --check
          git commit -m "perf: use lightweight live polling outside match detail"
          git push origin HEAD:perf/homepage-phase3-redo
