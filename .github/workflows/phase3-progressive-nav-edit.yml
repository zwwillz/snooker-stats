name: Apply Phase 3 Progressive Nav Refactor

on:
  push:
    branches:
      - perf/homepage-phase3-redo
    paths:
      - .github/workflows/phase3-progressive-nav-edit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: perf/homepage-phase3-redo
          fetch-depth: 0
      - name: Apply exact source replacements
        run: python .github/scripts/phase3_progressive_nav.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/snooker/snooker-data-center-v2.tsx
          git diff --cached --check
          git commit -m "perf: make bottom navigation progressively interactive"
          git push origin HEAD:perf/homepage-phase3-redo
