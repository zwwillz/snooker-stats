name: Diagnose Phase 4 final core
'on':
  push:
    branches: ['feat/tournaments-phase4a-web']
    paths: ['.github/workflows/diagnose-phase4-final.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: npm
      - run: npm ci
      - run: npm run test:core > phase4-final-core.txt 2>&1 || true
      - run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          git add phase4-final-core.txt
          git commit -m 'chore: capture final phase4 core failure'
          git push origin HEAD:feat/tournaments-phase4a-web
