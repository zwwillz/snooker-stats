name: Phase 4A refine runner

on:
  push:
    branches:
      - feat/tournaments-phase4a-web

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
          fetch-depth: 0
      - name: Apply patch script
        run: python scripts/phase4a-refine.py
      - name: Remove temporary files
        run: rm scripts/phase4a-refine.py .github/workflows/phase4a-refine-run.yml
      - name: Commit and push
        run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          git add app/snooker/snooker-data-center-v2.tsx app/snooker/snooker-priority.module.css scripts/phase4a-refine.py .github/workflows/phase4a-refine-run.yml
          git commit -m "refine(tournaments): improve event navigation and recent cards"
          git push origin HEAD:feat/tournaments-phase4a-web
