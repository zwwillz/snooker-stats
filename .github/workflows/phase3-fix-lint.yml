name: Phase 3 Fix Lint

on:
  push:
    paths:
      - .github/workflows/phase3-fix-lint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/homepage-phase3-redo
          fetch-depth: 0
      - name: Apply asserted lint fixes
        run: python3 .github/scripts/phase3_fix_lint.py
      - name: Remove temporary patch files
        run: rm .github/scripts/phase3_fix_lint.py .github/workflows/phase3-fix-lint.yml
      - name: Commit fixes
        run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          git add app/snooker/snooker-data-center-v2.tsx lib/snooker/home-bootstrap.ts .github/scripts/phase3_fix_lint.py .github/workflows/phase3-fix-lint.yml
          git commit -m "Fix phase 3 lint regressions"
          git push origin HEAD:perf/homepage-phase3-redo
