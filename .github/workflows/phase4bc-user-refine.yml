name: Phase4BC user refinement

on:
  push:
    branches:
      - feat/tournaments-phase4a-web

permissions:
  contents: write

jobs:
  refine:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply requested tournament web refinements
        run: |
          echo '' | base64 -d > /tmp/phase4bc_patch.py
          python3 /tmp/phase4bc_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm test

      - name: Commit refinement
        run: |
          rm .github/workflows/phase4bc-user-refine.yml
          git add app/snooker/snooker-data-center-v2.tsx app/snooker/snooker-priority.module.css tests/tournaments-phase4.test.mjs .github/workflows/phase4bc-user-refine.yml
          git status --short
          git commit -m "refactor(tournaments): refine sticky event web header"
          git push origin HEAD:feat/tournaments-phase4a-web
