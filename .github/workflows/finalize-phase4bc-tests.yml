name: Finalize Phase 4BC regression
'on':
  push:
    branches: ['feat/tournaments-phase4a-web']
    paths: ['.github/workflows/finalize-phase4bc-tests.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tournaments-phase4a-web
      - name: Update regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/snooker-data-foundation.test.mjs')
          s=p.read_text()
          s=s.replace('test("snooker event lifecycle keeps a finished event featured for one day then advances", async () => {', 'test("snooker event lifecycle prioritizes the next event after the live event", async () => {')
          s=s.replace('assert.match(uiSource, /activeEventCard \\?\\? graceEventCard \\?\\? firstUpcomingMain/);', 'assert.match(uiSource, /activeEventCard \\?\\? firstUpcomingMain \\?\\? graceEventCard/);')
          anchor='  assert.match(uiSource, /nextEventCard = featuredEventCard/);\n});\n'
          extra='''  assert.match(uiSource, /nextEventCard = featuredEventCard/);\n});\n\ntest("phase 4 event and match details keep desktop hierarchy without widening the data load", async () => {\n  const [uiSource, priorityCss] = await Promise.all([\n    read("app/snooker/snooker-data-center-v2.tsx"),\n    read("app/snooker/snooker-priority.module.css"),\n  ]);\n  assert.match(uiSource, /data-event-detail/);\n  assert.match(uiSource, /data-match-detail/);\n  assert.match(uiSource, /matchContextBar/);\n  assert.match(uiSource, /matchDetailBodyWithData/);\n  assert.match(uiSource, /eventScheduleStack/);\n  assert.match(priorityCss, /TOURNAMENTS_PHASE4BC_CORE/);\n  assert.match(priorityCss, /grid-template-columns:minmax\\(0,1.2fr\\) minmax\\(380px,.8fr\\)/);\n  assert.match(priorityCss, /position:sticky;top:var\\(--snooker-header-height\\)/);\n  assert.doesNotMatch(uiSource, /Promise\\.all\\([^)]*ensureMatchDetail/);\n});\n'''
          if anchor not in s: raise SystemExit('test anchor missing')
          s=s.replace(anchor, extra, 1)
          p.write_text(s)
          PY
      - name: Clean diagnostics and commit
        run: |
          git config user.name willz
          git config user.email zw.will@outlook.com
          rm -f .github/workflows/finalize-phase4bc-tests.yml .github/workflows/diagnose-core-phase4bc.yml phase4bc-core-output.txt
          git add tests/snooker-data-foundation.test.mjs .github phase4bc-core-output.txt
          git commit -m 'test(tournaments): align regression with phase 4 behavior'
          git push origin HEAD:feat/tournaments-phase4a-web
